name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false

      
      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'

      - name: Show node & npm versions
        run: |
          node --version
          npm --version

     
      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build --if-present

      
      - name: Copy SWA config into build output (if present)
        run: |
          BUILD_DIR="dist/SMS-LMS"
          if [ -f staticwebapp.config.json ]; then
            mkdir -p "$BUILD_DIR"
            cp staticwebapp.config.json "$BUILD_DIR"/
            echo "Copied staticwebapp.config.json into $BUILD_DIR"
          else
            echo "No staticwebapp.config.json found — skipping copy"
          fi

    
      - name: Build And Deploy (upload pre-built app)
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_RED_BUSH_018DAF310 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          skip_app_build: true
          app_location: "dist/SMS-LMS/browser"  
          api_location: ""               
          output_location: ""           

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_RED_BUSH_018DAF310 }}
          action: "close"



