<br>
<div class="container">
  <h2>Registered Courses</h2>
  
  
  <div *ngIf="registeredCourses.length === 0" class="alert alert-info mt-3">
    No registered courses found.
  </div>
  
  <table *ngIf="registeredCourses.length > 0" class="table table-bordered table-striped mt-3">
    <thead>
       <tr class="button-row">
          <!-- span the first 2 columns (Course Code, Course Name) -->
          <th colspan="2"></th>
          <!-- place the button over the Status column -->
          <th class="button-cell">
            <button class="register-btn" (click)="openModal()">Register Course</button>
          </th>
        </tr>
      <tr>
        <th>Course Code</th>
        <th>Course Name</th>
        <th>Status</th>
        
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let course of registeredCourses">
          <td>{{ course?.courseCode || 'N/A' }}</td>
          <td>{{ course?.courseName || 'N/A' }}</td>
          <td>{{ course?.status ? 'First Attempt' : 'Second Attempt' }}</td>
      </tr>
    </tbody>
  </table>

  <!-- Modal -->
  <div class="modal-overlay" *ngIf="showModal">
     <div class ="modal-content">
      <div class="modal-header">
        <h4 class="custom-modal-title">Register Course</h4>
        <span class=" register-close" (click)="closeModal()">&times;</span>
      </div>
      <div class="modal-body">
        <form (ngSubmit)="registerCourse()" class="form">
          <div class="form-group">
            <label for="courseCode" class="form-field">Select a course</label>
            <select
              id="courseCode"
              [(ngModel)]="registerCourseDto.CourseCode"
              name="courseCode"
              class="form-control"
              required
            >
              <option value="" disabled selected>Select a course</option>
              <option *ngFor="let course of FacultyCourses" [value]="course.courseCode">
                {{ course.courseName }} ({{ course.courseCode }})
              </option>
            </select><br>

          <button type="submit" class="btn btn-success">Register</button>
        
      </div>  
      </form>

     </div>
  </div>

  
</div>
