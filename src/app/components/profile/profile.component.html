<ng-template #loadingTpl>
  <div class="text-center p-4">
    <i class="spinner-border"></i>
    Loading profile…
  </div>
</ng-template>

<div class="profile-container container" *ngIf="!loading; else loadingTpl">
  <!-- ROW 1: Avatar preview + upload button -->
 <div class="profile-picture-container">
    <!-- either show the image… -->
    <ng-container *ngIf="avatarUrl; else initialsTpl">
      <img
        [src]="avatarUrl"
        class="profile-avatar"
        alt="Your profile picture"
      />
    </ng-container>
    <!-- …or the initials fallback: -->
    <ng-template #initialsTpl>
      <div class="profile-avatar initials-avatar">
        {{ initials }}
      </div>
    </ng-template>

    <!-- hidden file input + trigger button -->
    <input
      #fileInput
      type="file"
      accept="image/*"
      hidden
      (change)="onFileChange($event)"
    />
    <button class="upload-btn" (click)="fileInput.click()">
      Change Picture
    </button>
  </div>

  <!-- ROW 2: Personal Information Card -->
  <div class="row justify-content-center">
      <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
          <h3 class="mb-0">Personal Information</h3>
           <button class="edit-btn" (click)="editMode = !editMode">
            {{ editMode ? 'Cancel' : 'Edit' }}
          </button>
        </div>


<form *ngIf="editMode" (ngSubmit)="updateProfile()" class="form-grid">
  <div class="form-group">
    <label for="fullName">Full Name</label>
    <input
      type="text"
      id="fullName"
      name="fullName"
      class="form-control"
      [(ngModel)]="profile.fullName"
      required
    />
  </div>

  <div class="form-group">
    <label for="username">Username</label>
    <input
      type="text"
      id="username"
      name="username"
      class="form-control"
      [(ngModel)]="profile.username"
      required
    />
  </div>

  <div class="form-group">
    <label for="regNumber">Reg Number</label>
    <input
      type="text"
      id="regNumber"
      name="regNumber"
      class="form-control"
      [(ngModel)]="profile.regNumber"
      disabled
    />
  </div>

  <div class="form-group">
    <label for="email">Email</label>
    <input
      type="email"
      id="email"
      name="email"
      class="form-control"
      [(ngModel)]="profile.email"
      required
    />
  </div>

  <div class="form-group">
    <label for="phoneNumber">Phone Number</label>
    <input
      type="text"
      id="phoneNumber"
      name="phoneNumber"
      class="form-control"
      [(ngModel)]="profile.phoneNumber"
    />
  </div>

  <div class="form-actions mt-3">
    <button type="submit" class="btn btn-success ">Save</button>
  </div>
</form>

    <div *ngIf="!editMode" class="info-grid">
      <div><strong>Full Name:</strong> {{ profile.fullName }}</div>
      <div><strong>Username:</strong> {{ profile.username }}</div>
      <div><strong>Reg Number:</strong> {{ profile.regNumber }}</div>
      <div><strong>Email:</strong> {{ profile.email }}</div>
      <div><strong>Phone Number:</strong> {{ profile.phoneNumber }}</div>
    </div>
  </div>

  <!-- CHANGE PASSWORD -->
  <div class="profile-actions">
    <button class="btn btn-primary" (click)="toggleChangePasswordForm()">
      {{ showPasswordForm ? 'Cancel' : 'Change Password' }}
    </button>
  </div>

  <!-- PASSWORD MODAL BACKDROP -->
  <div *ngIf="showPasswordForm" class="modal-backdrop fade show"></div>

  <!-- PASSWORD MODAL -->
  <div
    *ngIf="showPasswordForm"
    class="modal fade show d-block"
    tabindex="-1"
    role="dialog"
    aria-modal="true"
  >
    <div class="modal-dialog modal-dialog-centered" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Change Password</h5>
          <button type="button" class="btn-close" (click)="toggleChangePasswordForm()"></button>
        </div>
        <form (ngSubmit)="changePassword()" class="modal-body">
          <div class="mb-3">
            <label for="currentPwd" class="form-label">Current Password</label>
            <input
              id="currentPwd"
              type="password"
              [(ngModel)]="passwordModel.currentPassword"
              name="currentPassword"
              class="form-control"
              required
            />
          </div>
          <div class="mb-3">
            <label for="newPwd" class="form-label">New Password</label>
            <input
              id="newPwd"
              type="password"
              [(ngModel)]="passwordModel.newPassword"
              name="newPassword"
              class="form-control"
              required
            />
          </div>
          <div class="mb-3">
            <label for="confirmPwd" class="form-label">Confirm New Password</label>
            <input
              id="confirmPwd"
              type="password"
              [(ngModel)]="passwordModel.confirmPassword"
              name="confirmPassword"
              class="form-control"
              required
            />
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary btn-sm"
              (click)="toggleChangePasswordForm()"
            >
              Cancel
            </button>
            <button
              type="submit"
              class="btn btn-primary btn-sm"
              [disabled]="
                !passwordModel.currentPassword ||
                !passwordModel.newPassword ||
                passwordModel.newPassword !== passwordModel.confirmPassword
              "
            >
              Change Password
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

</div>
