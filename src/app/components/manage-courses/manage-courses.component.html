<div class="container">
  <h1>Courses</h1>

  <button class="btn btn-primary mb-3" (click)="openAddModal()">
    + Add New Course
  </button>

  <div *ngIf="errorMessage" class="alert alert-danger">
    {{ errorMessage }}
  </div>

  <table *ngIf="courses.length" class="table table-bordered table-striped">
    <thead class="thead-dark">
      <tr>
        <th>#</th>
        <th>Course Code</th>
        <th>Course Name</th>
        <th>Teacher Name</th>
        <th>Faculty Code</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let course of courses; let i = index">
        <td>{{ i + 1 }}</td>
        <td>{{ course.courseCode }}</td>
        <td>{{ course.courseName }}</td>
        <td>{{ course.teacherName }}</td>
        <td>{{ course.facultyCode }}</td>
        <td>
          <div class="btn-group" role="group" aria-label="Course actions">
              <button class="btn btn-sm btn-info"
                      (click)="openEditModal(course)">
                Edit
              </button>
              <button class="btn btn-sm btn-danger"
                      (click)="deleteCourse(course.id)">
                Delete
              </button>
            </div>
        </td>
      </tr>
    </tbody>
  </table>

  <div *ngIf="!courses.length" class="alert alert-info">
    No courses available.
  </div>
</div>

<!-- Modal -->
<div *ngIf="showModal" class="modal-backdrop fade show"></div>
<div *ngIf="showModal" class="modal fade show d-block" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">
          {{ isEditMode ? 'Edit Course' : 'Add New Course' }}
        </h5>
        <button type="button" class="btn-close" (click)="closeModal()"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label>Course Code</label>
          <input [(ngModel)]="formModel.courseCode"
                 name="courseCode"
                 class="form-control" />
        </div>
        <div class="mb-3">
          <label>Course Name</label>
          <input [(ngModel)]="formModel.courseName"
                 name="courseName"
                 class="form-control" />
        </div>
        <div class="mb-3">
          <label>Teacher Name</label>
          <input [(ngModel)]="formModel.teacherName"
                 name="teacherName"
                 class="form-control" />
        </div>
        <div class="mb-3">
          <label>Faculty</label>
          <select [(ngModel)]="formModel.selectedFaculty"
                  name="selectedFaculty"
                  class="form-select">
            <option value="">-- select faculty --</option>
            <option *ngFor="let f of faculties" [ngValue]="f">
              {{ f.facultyCode }} — {{ f.facultyName }}
            </option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
       <button type="button" class="btn btn-secondary" (click)="closeModal()">Cancel</button>
       <button type="button" class="btn btn-primary" (click)="addCourse()">
          {{ isEditMode ? 'Save Changes' : 'Create Course' }}
        </button>
      </div>
    </div>
  </div>
</div>
