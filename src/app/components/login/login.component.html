<div class="modal-backdrop">
  <div class="modal-card">
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="modal-form">
      <h2 class="modal-title">Login</h2>

      <div class="form-group">
        <label for="username">Username</label>
        <input id="username" formControlName="username" type="text" />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" formControlName="password" type="password" />
      </div>

      <button type="submit" class="btn-primary">Login</button>

      <div class="modal-footer">
        <a routerLink="/forgot-password" class="link">Forgot Password?</a>
        <p class="register-text">
          Don’t have an account?
          <a routerLink="/register" class="link">Register here</a>
        </p>
      </div>

      <p *ngIf="errorMessage" class="error-text">{{ errorMessage }}</p>
    </form>
  </div>
</div>
