<div class="modal-backdrop">
  <div class="modal-card">
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" autocomplete="on" class="modal-form">
      <h2 class="modal-title">Register</h2>

      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input id="fullName" formControlName="fullName" type="text" />
      </div>

      <div class="form-group">
        <label for="username">Username</label>
        <input id="username" formControlName="username" type="text" />
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" formControlName="email" type="email" />
      </div>

      <div class="form-group">
        <label for="role">Role</label>
        <select id="role" formControlName="role">
          <option value="Student">Student</option>
          <option value="Admin">Admin</option>
          <option value="Finance">Finance</option>
          <option value="Teacher">Teacher</option>
        </select>
      </div>

      <div class="form-group" *ngIf="showFacultySelect">
      <label for="faculty">Select Faculty</label>
      <select id="faculty" formControlName="facultyName">
        <option value="">-- Select Faculty --</option>
        <option *ngFor="let faculty of faculties" [value]="faculty.facultyName">
          {{ faculty.facultyName }}
        </option>
      </select>
    </div>


      <button type="submit" class="btn-primary">Register</button>

      <p *ngIf="successMessage" class="success-text">{{ successMessage }}</p>
      <p *ngIf="errorMessage" class="error-text">{{ errorMessage }}</p>

      <div class="modal-footer">
        <a routerLink="/login" class="link">Login Instead</a>
      </div>
    </form>
  </div>
</div>
