<ng-template #loading>
  <div class="text-center p-4">
    <i class="spinner-border"></i>
    Loading profile…
  </div>
</ng-template>


<div class="profile-container" *ngIf="profile; else loading">
   <div class="profile-picture-container">
    <!-- either show the image… -->
    <ng-container *ngIf="avatarUrl; else initialsTpl">
      <img
        [src]="avatarUrl"
        class="profile-avatar"
        alt="Your profile picture"
      />
    </ng-container>
    <!-- …or the initials fallback: -->
    <ng-template #initialsTpl>
      <div class="profile-avatar initials-avatar">
        {{ initials }}
      </div>
    </ng-template>

    <!-- hidden file input + trigger button -->
    <input
      #fileInput
      type="file"
      accept="image/*"
      hidden
      (change)="onFileChange($event)"
    />
    <button class="upload-btn" (click)="fileInput.click()">
      Change Picture
    </button>
  </div>
  
  <!-- Personal Information Card -->
  <div class="card">
    <div class="card-header">
      <h3>Personal Information</h3>
      <button class="edit-btn" (click)="editMode = !editMode">
        {{ editMode ? 'Cancel' : 'Edit' }}
      </button>
    </div>

    <form *ngIf="editMode" (ngSubmit)="updateProfile()" class="form-grid">
      <div class="form-item">
        <label>Full Name</label>
        <input [(ngModel)]="profile.fullName" name="fullName" required />
      </div>
      <div class="form-item">
        <label>Username</label>
        <input [(ngModel)]="profile.username" name="username" required />
      </div>
      <div class="form-item">
        <label>Email</label>
        <input [(ngModel)]="profile.email" name="email" required />
      </div>
      <div class="form-item">
        <label>Phone Number</label>
        <input [(ngModel)]="profile.phoneNumber" name="phoneNumber" required />
      </div>
      <div class="form-item full-width">
        <button type="submit" class="save-btn">Save</button>
      </div>
    </form>

    <div *ngIf="!editMode" class="info-grid">
      <div><strong>Full Name:</strong> {{ profile.fullName }}</div>
      <div><strong>Username:</strong> {{ profile.username }}</div>
      <div><strong>Email:</strong> {{ profile.email }}</div>
      <div><strong>Phone Number:</strong> {{ profile.phoneNumber }}</div>
    </div>
  </div>

  <!-- Change Password Card -->
  <div class="profile-actions">
  <button class="btn btn-primary" (click)="toggleChangePasswordForm()">
    {{ showPasswordForm ? 'Cancel' : 'Change Password' }}
  </button>
</div>

<!-- Backdrop -->
<div
  *ngIf="showPasswordForm"
  class="modal-backdrop fade show"
></div>

<!-- Modal -->
<div
  *ngIf="showPasswordForm"
  class="modal fade show d-block"
  tabindex="-1"
  role="dialog"
  aria-modal="true"
>
  <div class="modal-dialog modal modal-dialog-centered" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Change Password</h5>
        <button type="button" class="btn-close" (click)="toggleChangePasswordForm()"></button>
      </div>
      <form (ngSubmit)="changePassword()" class="modal-body">
        <div class="mb-3">
          <label for="currentPwd" class="form-label">Current Password</label>
          <input
            id="currentPwd"
            type="password"
            [(ngModel)]="passwordModel.currentPassword"
            name="currentPassword"
            class="form-control"
            required
          />
        </div>
        <div class="mb-3">
          <label for="newPwd" class="form-label">New Password</label>
          <input
            id="newPwd"
            type="password"
            [(ngModel)]="passwordModel.newPassword"
            name="newPassword"
            class="form-control"
            required
          />
        </div>
        <div class="mb-3">
          <label for="confirmPwd" class="form-label">Confirm New Password</label>
          <input
            id="confirmPwd"
            type="password"
            [(ngModel)]="passwordModel.confirmPassword"
            name="confirmPassword"
            class="form-control"
            required
          />
        </div>
        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-secondary btn-sm"
            (click)="toggleChangePasswordForm()"
          >
            Cancel
          </button>
          <button
            type="submit"
            class="btn btn-primary btn-sm"
            [disabled]="!passwordModel.currentPassword || !passwordModel.newPassword || passwordModel.newPassword !== passwordModel.confirmPassword"
          >
            Change Password
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
